name: Free Windows RDP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Set Runner Admin Password
      run: |
        net user runneradmin P@ssw0rd!

    - name: Download and Extract Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/b4Pvu2372xm/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."

    - name: Authenticate Ngrok
      run: |
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start Ngrok Tunnel
      run: |
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 5

    - name: Get RDP Connection Details
      run: |
        $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $publicUrl = $response.tunnels[0].public_url
        Write-Host "=========================================="
        Write-Host "RDP Address: $publicUrl"
        Write-Host "Username: runneradmin"
        Write-Host "Password: P@ssw0rd!"
        Write-Host "=========================================="

    - name: Keep RDP Alive (6 Hours)
      run: |
        $seconds = 21000
        while ($seconds -gt 0) {
            Start-Sleep -Seconds 60
            $seconds -= 60
        }
